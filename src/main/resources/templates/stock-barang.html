<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>
    Prima Elektronik - Spring Boot
  </title>
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link id="pagestyle" href="/assets/css/soft-ui-dashboard.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<style>
  @media print {
    body {
      zoom: 2;
    }

    @page {
      margin: 0;
    }

    .rmvBtn {
      visibility: collapse;
    }
  }
</style>

<body class="g-sidenav-show  bg-gray-100">
  <!-- Sidenav (Simplified for demo) -->
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-0 border-radius-xl my-3 fixed-start ms-3"
    id="sidenav-main">
    <div class="sidenav-header">
      <a class="navbar-brand m-0" href="#">
        <h4 class="font-weight-bold">Prima Elektronik</h4>
      </a>
    </div>
    <hr class="horizontal dark mt-0">
    <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard">
            <div
              class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
              <i class="fas fa-shop text-dark"></i>
            </div>
            <span class="nav-link-text ms-1">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/stock-barang">
            <div
              class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
              <i class="fas fa-box text-dark"></i>
            </div>
            <span class="nav-link-text ms-1">Stock Barang</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/finance">
            <div
              class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
              <i class="fas fa-money-bill text-dark"></i>
            </div>
            <span class="nav-link-text ms-1">Keuangan</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/bill">
            <div
              class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
              <i class="fas fa-file-invoice text-dark"></i>
            </div>
            <span class="nav-link-text ms-1">Tagihan</span>
          </a>
        </li>

        <li class="nav-item mt-3">
          <h6 class="ps-4 ms-2 text-uppercase text-xs font-weight-bolder opacity-6">Akun</h6>
        </li>
        <li class="nav-item">
          <form action="/logout" method="post" id="logoutForm">
            <a class="nav-link" href="#" onclick="document.getElementById('logoutForm').submit();">
              <div
                class="icon icon-shape icon-sm shadow border-radius-md bg-white text-center me-2 d-flex align-items-center justify-content-center">
                <i class="fas fa-sign-out-alt text-dark"></i>
              </div>
              <span class="nav-link-text ms-1">Keluar</span>
            </a>
          </form>
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
    <div class="container-fluid py-4">

      <!-- Single Stock Table with Integrated Filter -->
      <div class="row">
        <div class="col-12">
          <div class="card mb-4">
            <div class="card-header pb-0">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6>Daftar Barang</h6>
                <button type="button" class="btn btn-primary btn-sm mb-0" data-bs-toggle="modal"
                  data-bs-target="#addStockModal" th:if="${isLoggedIn}">
                  <i class="fas fa-plus me-2"></i> Tambah Barang
                </button>
              </div>

              <form method="get" action="/stock-barang" class="row g-3">
                <div class="col-md-4">
                  <label for="search" class="form-label text-xs font-weight-bold">Cari Barang</label>
                  <div class="input-group input-group-sm">
                    <span class="input-group-text text-body"><i class="fas fa-search" aria-hidden="true"></i></span>
                    <input type="text" class="form-control" id="search" name="search" th:value="${search}"
                      placeholder="Ketik nama barang..." onkeydown="if(event.key === 'Enter') this.form.submit()">
                  </div>
                </div>
                <div class="col-md-4">
                  <label for="store" class="form-label text-xs font-weight-bold">Toko</label>
                  <select class="form-control form-control-sm" id="store" name="store" onchange="this.form.submit()">
                    <option value="" th:selected="${selectedStore == null}">Semua Toko</option>
                    <option value="1" th:selected="${selectedStore == 1}">Toko 1</option>
                    <option value="2" th:selected="${selectedStore == 2}">Toko 2</option>
                    <option value="3" th:selected="${selectedStore == 3}">Toko 3</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="stockLimit" class="form-label text-xs font-weight-bold">Status Stok</label>
                  <select class="form-control form-control-sm" id="stockLimit" name="stockLimit"
                    onchange="this.form.submit()">
                    <option value="" th:selected="${selectedStockLimit == null}">Semua Status</option>
                    <option value="less5" th:selected="${selectedStockLimit == 'less5'}">Stok Menipis (< 5)</option>
                    <option value="more5" th:selected="${selectedStockLimit == 'more5'}">Stok Aman (>= 5)</option>
                  </select>
                </div>
              </form>
            </div>
            <div class="card-body px-0 pt-0 pb-2">
              <div class="table-responsive p-0">
                <table class="table align-items-center mb-0" id="stockTable">
                  <thead>
                    <tr>
                      <th class="text-uppercase text-secondary font-weight-bolder opacity-7">Barang</th>
                      <th class="text-uppercase text-secondary font-weight-bolder opacity-7 ps-2">Harga</th>
                      <th class="text-center text-uppercase text-secondary font-weight-bolder opacity-7">Jumlah</th>
                      <th class="text-center text-uppercase text-secondary font-weight-bolder opacity-7">Toko</th>
                      <th class="text-secondary opacity-7" th:if="${isLoggedIn}">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="row : ${stocks}">
                      <td>
                        <div class="d-flex px-2 py-1">
                          <div>
                            <svg th:id="'barcode' + ${row.id}"></svg>
                            <script th:inline="javascript">
                              /*<![CDATA[*/
                              JsBarcode("#barcode" + /*[[${row.id}]]*/, /*[[${row.id}]]*/, {
                                format: "CODE128", lineColor: "#000", width: 1, height: 25, displayValue: false
                              });
                              /*]]>*/
                            </script>
                          </div>
                          <div class="d-flex flex-column justify-content-center">
                            <h6 class="mb-0 text-sm" th:text="${row.name}">Name</h6>
                          </div>
                        </div>
                      </td>
                      <td>
                        <p class="text-xs font-weight-bold mb-0"
                          th:text="'Rp. ' + ${#numbers.formatDecimal(row.priceFinal, 0, 'POINT', 0, 'COMMA')}">Price</p>
                        <p class="text-xs text-secondary mb-0"
                          th:text="'Rp. ' + ${#numbers.formatDecimal(row.priceInit, 0, 'POINT', 0, 'COMMA')}">Init Price
                        </p>
                      </td>
                      <td class="align-middle text-center text-sm">
                        <span class="badge badge-sm"
                          th:classappend="${row.qty > 9} ? 'bg-gradient-success' : 'bg-gradient-danger'"
                          th:text="${row.qty} + ' Pcs'">Qty</span>
                      </td>
                      <td class="align-middle text-center text-sm">
                        <span class="text-secondary text-xs font-weight-bold"
                          th:text="'Toko ' + ${row.store}">Store</span>
                      </td>
                      <td class="align-middle text-end pe-4" th:if="${isLoggedIn}">
                        <button class="btn btn-warning btn-sm" th:data-id="${row.id}" th:data-name="${row.name}"
                          th:data-priceinit="${row.priceInit}" th:data-pricefinal="${row.priceFinal}"
                          th:data-qty="${row.qty}" th:data-store="${row.store}" onclick="openEditModal(this)">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" th:data-id="${row.id}" onclick="openDeleteModal(this)">
                          <i class="fas fa-trash"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Add Stock Modal -->
  <div class="modal fade" id="addStockModal" tabindex="-1" role="dialog" aria-labelledby="addStockModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addStockModalLabel">Tambah Barang</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="addStockForm">
            <div class="form-group">
              <label for="addName">Nama Barang</label>
              <input type="text" class="form-control" id="addName" required>
            </div>
            <div class="form-group">
              <label for="addPriceInit">Harga Awal</label>
              <input type="number" class="form-control" id="addPriceInit" required>
            </div>
            <div class="form-group">
              <label for="addPriceFinal">Harga Jual</label>
              <input type="number" class="form-control" id="addPriceFinal" required>
            </div>
            <div class="form-group">
              <label for="addQty">Jumlah</label>
              <input type="number" class="form-control" id="addQty" required>
            </div>
            <div class="form-group">
              <label for="addStore">Toko</label>
              <select class="form-control" id="addStore">
                <option value="1">Toko 1</option>
                <option value="2">Toko 2</option>
                <option value="3">Toko 3</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn bg-gradient-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn bg-gradient-primary" onclick="addStock()">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Stock Modal -->
  <div class="modal fade" id="editStockModal" tabindex="-1" role="dialog" aria-labelledby="editStockModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editStockModalLabel">Edit Barang</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="editStockForm">
            <input type="hidden" id="editId">
            <div class="form-group">
              <label for="editName">Nama Barang</label>
              <input type="text" class="form-control" id="editName" required>
            </div>
            <div class="form-group">
              <label for="editPriceInit">Harga Awal</label>
              <input type="number" class="form-control" id="editPriceInit" required>
            </div>
            <div class="form-group">
              <label for="editPriceFinal">Harga Jual</label>
              <input type="number" class="form-control" id="editPriceFinal" required>
            </div>
            <div class="form-group">
              <label for="editQty">Jumlah</label>
              <input type="number" class="form-control" id="editQty" required>
            </div>
            <div class="form-group">
              <label for="editStore">Toko</label>
              <select class="form-control" id="editStore">
                <option value="1">Toko 1</option>
                <option value="2">Toko 2</option>
                <option value="3">Toko 3</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn bg-gradient-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn bg-gradient-primary" onclick="updateStock()">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteStockModal" tabindex="-1" role="dialog" aria-labelledby="deleteStockModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteStockModalLabel">Konfirmasi Hapus</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p>Apakah Anda yakin ingin menghapus barang ini?</p>
          <input type="hidden" id="deleteId">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn bg-gradient-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn bg-gradient-danger" onclick="deleteStock()">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function addStock() {
      const data = {
        name: document.getElementById('addName').value,
        priceInit: document.getElementById('addPriceInit').value,
        priceFinal: document.getElementById('addPriceFinal').value,
        qty: document.getElementById('addQty').value,
        store: document.getElementById('addStore').value
      };

      fetch('/api/stock', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            alert("Gagal menambahkan barang");
          }
        })
        .catch(error => console.error('Error:', error));
    }

    function openEditModal(button) {
      document.getElementById('editId').value = button.getAttribute('data-id');
      document.getElementById('editName').value = button.getAttribute('data-name');
      document.getElementById('editPriceInit').value = button.getAttribute('data-priceinit');
      document.getElementById('editPriceFinal').value = button.getAttribute('data-pricefinal');
      document.getElementById('editQty').value = button.getAttribute('data-qty');
      document.getElementById('editStore').value = button.getAttribute('data-store');

      var myModal = new bootstrap.Modal(document.getElementById('editStockModal'));
      myModal.show();
    }

    function updateStock() {
      const id = document.getElementById('editId').value;
      const data = {
        name: document.getElementById('editName').value,
        priceInit: document.getElementById('editPriceInit').value,
        priceFinal: document.getElementById('editPriceFinal').value,
        qty: document.getElementById('editQty').value,
        store: document.getElementById('editStore').value
      };

      fetch('/api/stock/' + id, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            alert("Gagal mengupdate barang");
          }
        })
        .catch(error => console.error('Error:', error));
    }

    function openDeleteModal(button) {
      document.getElementById('deleteId').value = button.getAttribute('data-id');
      var myModal = new bootstrap.Modal(document.getElementById('deleteStockModal'));
      myModal.show();
    }

    function deleteStock() {
      const id = document.getElementById('deleteId').value;

      fetch('/api/stock/' + id, {
        method: 'DELETE'
      })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            alert("Gagal menghapus barang");
          }
        })
        .catch(error => console.error('Error:', error));
    }
  </script>

  <script src="/assets/js/core/popper.min.js"></script>
  <script src="/assets/js/core/bootstrap.min.js"></script>
  <script src="/assets/js/soft-ui-dashboard.min.js"></script>
</body>

</html>
